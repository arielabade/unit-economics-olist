[project]
name = "unit-economics-olist"
version = "0.2.0"
description = "CAC, LTV, payback and contribution margin by acquisition channel for an online retailer, in DuckDB SQL"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "streamlit>=1.46",
    "altair>=5.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Reading the ecommerce MySQL. Not needed for tests, figures or the dashboard,
# which work from the committed reports/.
ingest = ["pymysql>=1.1"]
dev = ["pytest>=7.4", "fonttools>=4.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
